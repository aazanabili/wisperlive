name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Good stable version for pyinstaller

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile main.py
        
    - name: Rename Executable
      run: |
        Rename-Item -Path "dist\main.exe" -NewName "WhisperLive.exe"

    - name: Upload Artifact (For Manual Triggers)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: WhisperLive-Windows
        path: dist/WhisperLive.exe

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/WhisperLive.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
